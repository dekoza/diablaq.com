{# Karta projektu: okładka + tytuł + opis. #}
<article class="project-card">
  <a class="project-card__cover {{ p.latest_cover_aspect_class }}" href="{{ p.url }}" aria-label="{{ p.title }}">
    {% if p.latest_cover_image %}
      <img class="cover-img" src="{{ p.latest_cover_image }}" alt="{{ p.title }} – okładka" loading="lazy">
    {% elif p.cover_image %}
      <img class="cover-img" src="{{ p.cover_image }}" alt="{{ p.title }} – okładka" loading="lazy">
    {% else %}
      <div class="cover-placeholder" aria-label="{{ p.title }}">
        <span class="cover-placeholder__initials">{{ p.title[:2] | upper }}</span>
      </div>
    {% endif %}
  </a>
  <h3 class="project-card__title"><a href="{{ p.url }}">{{ p.title }}</a></h3>
  {% if p.summary %}
    <p class="project-card__summary">{{ p.summary }}</p>
  {% endif %}
</article>
