{% extends "base.html" %}

{% block title %}Ludzie – Wydawnictwo Diablaq{% endblock %}

{% block content %}
<header class="page-header">
  <h1>Ludzie</h1>
  <p class="page-header__lead">Autorzy, rysownicy i osoby współtworzące nasze publikacje.</p>
</header>

<section>
  {% if people %}
    <div class="tiles tiles--projects">
      {% for p in people %}
        <article class="project-card">
          <a class="project-card__cover project-card__cover--text" href="/ludzie/{{ p.slug }}/" aria-label="{{ p.name }}">
            <span class="project-card__cover-text">{{ p.name }}</span>
          </a>
        </article>
      {% endfor %}
    </div>
  {% else %}
    <p>Brak profili.</p>
  {% endif %}
</section>
{% endblock %}
