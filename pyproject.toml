[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diablaq-site"
version = "0.1.0"
description = "Static site generator for diablaq.com (Jinja2 + Markdown frontmatter)."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "jinja2>=3.1",
  "python-frontmatter>=1.1",
  "markdown>=3.6",
  "pillow>=10.0",
]

[project.scripts]
diablaq-build = "diablaq_site.cli:main"
diablaq-project-workbook = "diablaq_site.project_workbook:main"

[tool.setuptools]
packages = ["diablaq_site"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
